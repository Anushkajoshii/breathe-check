[project]
name = "breathe-check"
version = "0.1.0"
description = "Did Delhi's pollution rules work, or was it the weather? Is Indore's air as clean as its streets? When is it safest to run outside tomorrow?"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Anushka Joshi" }]
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pandas>=2.2",
    "pyarrow>=16",
    "duckdb>=1.1",
    "python-dotenv>=1.0",
    "huggingface-hub>=0.25",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "pre-commit>=3.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/breathe_check"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
