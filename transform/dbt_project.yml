name: breathe_check
version: "1.0.0"
profile: breathe_check
config-version: 2

model-paths: ["models"]
test-paths: ["tests"]
macro-paths: ["macros"]
target-path: "target"
clean-targets: ["target", "dbt_packages"]

vars:
  # Paths are relative to the repo root (where `make clean-data` runs dbt from)
  raw_dir: "data/raw"
  reference_dir: "reference"
  clean_dir: "data/clean"

models:
  breathe_check:
    staging:
      +materialized: view
    intermediate:
      +materialized: table
    marts:
      +materialized: table
      +post-hook: "copy {{ this }} to '{{ var('clean_dir') }}/{{ this.name }}.parquet' (format parquet)"
